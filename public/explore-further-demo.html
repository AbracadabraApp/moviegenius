<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Further Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #0f1419;
            color: #e6e6e6;
            line-height: 1.6;
        }
        
        .movie-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
        }
        
        .movie-title {
            font-size: 2.5em;
            margin: 0;
            color: #fff;
        }
        
        .explore-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2d3748;
            margin: 20px 0;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 20px;
        }
        
        .play-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            color: #4299e1;
        }
        
        .topic-list {
            display: grid;
            gap: 12px;
        }
        
        .topic-item {
            background: rgba(45, 55, 72, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(66, 153, 225, 0.2);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .topic-item:hover {
            border-color: rgba(66, 153, 225, 0.4);
            transform: translateY(-1px);
        }
        
        .topic-button {
            width: 100%;
            padding: 16px;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e2e8f0;
            font-weight: 500;
            transition: background 0.2s ease;
        }
        
        .topic-button:hover {
            background: rgba(66, 153, 225, 0.1);
        }
        
        .topic-button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .chevron {
            width: 20px;
            height: 20px;
            color: #4299e1;
            transition: transform 0.3s ease;
        }
        
        .chevron.expanded {
            transform: rotate(90deg);
        }
        
        .streaming-content {
            border-top: 1px solid rgba(66, 153, 225, 0.2);
            background: rgba(26, 32, 44, 0.8);
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        
        .exploration-text {
            color: #e2e8f0;
            white-space: pre-wrap;
            margin: 0;
        }
        
        .live-cursor {
            color: #4299e1;
            animation: blink 1s infinite;
        }
        
        .streaming-status {
            color: #4299e1;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .loading-dots {
            display: inline-flex;
            margin-left: 8px;
        }
        
        .loading-dots span {
            width: 4px;
            height: 4px;
            background: #4299e1;
            border-radius: 50%;
            margin-right: 2px;
            animation: dot-pulse 1.4s infinite ease-in-out;
        }
        
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        @keyframes dot-pulse {
            0%, 20% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            80%, 100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="movie-header">
        <h1 class="movie-title">Blade Runner</h1>
        <p>1982 • Sci-Fi • Ridley Scott</p>
    </div>
    
    <div class="explore-section">
        <h3 class="section-title">
            <svg class="play-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Explore Further
        </h3>
        
        <div class="topic-list">
            <div class="topic-item">
                <button class="topic-button" onclick="toggleTopic(0, 'cyberpunk-visual-aesthetics-and-neon-noir-cinematography')">
                    <span>Cyberpunk visual aesthetics and neon-noir cinematography</span>
                    <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
                <div class="streaming-content" id="content-0" style="display: none;"></div>
            </div>
            
            <div class="topic-item">
                <button class="topic-button" onclick="toggleTopic(1, 'ai-consciousness-and-the-turing-test-in-modern-cinema')">
                    <span>AI consciousness and the Turing test in modern cinema</span>
                    <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
                <div class="streaming-content" id="content-1" style="display: none;"></div>
            </div>
            
            <div class="topic-item">
                <button class="topic-button" onclick="toggleTopic(2, 'neo-noir-influences-on-science-fiction-filmmaking')">
                    <span>Neo-noir influences on science fiction filmmaking</span>
                    <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
                <div class="streaming-content" id="content-2" style="display: none;"></div>
            </div>
            
            <div class="topic-item">
                <button class="topic-button" onclick="toggleTopic(3, 'practical-effects-vs-cgi-in-world-building')">
                    <span>Practical effects vs CGI in world-building</span>
                    <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
                <div class="streaming-content" id="content-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        let activeTopics = new Set();
        
        async function toggleTopic(index, topicSlug) {
            const button = document.querySelectorAll('.topic-button')[index];
            const chevron = button.querySelector('.chevron');
            const content = document.getElementById(`content-${index}`);
            
            // If already expanded and not streaming, collapse
            if (content.style.display === 'block' && !activeTopics.has(index)) {
                content.style.display = 'none';
                chevron.classList.remove('expanded');
                return;
            }
            
            // If already streaming, ignore
            if (activeTopics.has(index)) return;
            
            // Expand and start streaming
            content.style.display = 'block';
            chevron.classList.add('expanded');
            activeTopics.add(index);
            
            try {
                console.log(`🎬 Streaming topic: ${topicSlug}`);
                
                // Show loading state
                content.innerHTML = `
                    <div class="streaming-status">
                        Generating exploration
                        <div class="loading-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    <div class="exploration-text" id="text-${index}"></div>
                `;
                
                const response = await fetch(`/api/explore-further/${topicSlug}`);
                const reader = response.body.getReader();
                const textElement = document.getElementById(`text-${index}`);
                
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;
                    
                    const chunk = new TextDecoder().decode(value);
                    
                    if (chunk.includes('__EXPLORATION_COMPLETE__')) {
                        // Remove cursor and status
                        content.innerHTML = `<div class="exploration-text">${buffer}</div>`;
                        console.log('✅ Topic exploration complete');
                        break;
                    } else {
                        buffer += chunk;
                        textElement.innerHTML = buffer + '<span class="live-cursor">█</span>';
                    }
                }
                
            } catch (error) {
                console.error('❌ Streaming failed:', error);
                content.innerHTML = `<div class="exploration-text">Sorry, this exploration failed to load. Please try again.</div>`;
            } finally {
                activeTopics.delete(index);
            }
        }
    </script>
</body>
</html>
