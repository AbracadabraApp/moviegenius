<!DOCTYPE html>
<html>
<head>
    <title>Simple Stream Test</title>
    <style>
        body { font-family: monospace; background: #222; color: #fff; padding: 20px; }
        .content { white-space: pre-wrap; }
        button { padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Simple Streaming Test</h1>
    <button onclick="testStream()">Start Stream</button>
    <div id="content" class="content"></div>
    <div id="status"></div>

    <script>
        async function testStream() {
            const content = document.getElementById('content');
            const status = document.getElementById('status');
            
            content.textContent = '';
            status.textContent = 'Starting...';
            
            try {
                console.log('Fetching stream...');
                const response = await fetch('/api/streaming-poc');
                console.log('Response received:', response.status);
                
                if (!response.body) {
                    throw new Error('No response body');
                }
                
                const reader = response.body.getReader();
                console.log('Reader created');
                
                while (true) {
                    const { done, value } = await reader.read();
                    console.log('Read chunk:', done, value?.length);
                    
                    if (done) break;
                    
                    const chunk = new TextDecoder().decode(value);
                    console.log('Decoded chunk:', chunk.substring(0, 50));
                    
                    content.textContent += chunk;
                    status.textContent = `Received ${content.textContent.length} characters`;
                }
                
                status.textContent = 'Complete!';
                
            } catch (error) {
                console.error('Stream error:', error);
                status.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
