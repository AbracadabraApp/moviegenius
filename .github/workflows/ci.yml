# MovieGenius CI/CD Pipeline
# Runs on every push and PR to ensure code quality and prevent broken builds

name: MovieGenius CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Code Quality Checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Check code formatting
        run: npx prettier --check .

      - name: Security audit
        run: npm audit --audit-level=moderate

  # Build Test
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Use dummy values for build test
          ANTHROPIC_API_KEY: 'dummy-key-for-build'
          NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'dummy-service-key'
          NEXT_PUBLIC_TMDB_API_KEY: 'dummy-tmdb-key'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 1

  # API Tests (if tests exist)
  test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run tests if they exist
      - name: Run tests
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No tests configured - skipping"
          fi

  # Deployment (Railway)
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Railway
        run: |
          echo "🚀 Triggering Railway deployment..."
          curl -X POST "https://backboard.railway.app/graphql" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentCreate(input: { projectId: \"69208135-567a-4f25-b85d-c757d9afaed1\", environmentId: \"production\" }) { id } }"}'

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Railway deployment to complete..."
          sleep 120  # Wait 2 minutes for deployment

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment health..."
          npm run deploy:verify
        env:
          NEXT_PUBLIC_BASE_URL: https://moviegenius.ai

      - name: Performance check
        run: |
          echo "📊 Running performance monitoring..."
          npm run monitor:performance
        env:
          NEXT_PUBLIC_BASE_URL: https://moviegenius.ai

      - name: Deployment success
        run: |
          echo "✅ Deployment verified successfully!"

  # Notification on failure
  notify-failure:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: failure()

    steps:
      - name: Failed build notification
        run: |
          echo "❌ BUILD FAILED - Team notification required"
          echo "::error::Build failed on ${{ github.ref }} - immediate attention needed"
