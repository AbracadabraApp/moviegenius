<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena - John Cassavetes Poster</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .poster {
            width: 300px;
            height: 450px;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 50%, #0d0d0d 100%);
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        
        .film-strip {
            position: absolute;
            left: -5px;
            top: 0;
            width: 30px;
            height: 100%;
            background: #333;
            border-right: 2px solid #555;
        }
        
        .film-strip::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5px;
            width: 15px;
            height: 100%;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 15px,
                #555 15px,
                #555 25px
            );
        }
        
        .title-area {
            position: absolute;
            top: 60px;
            left: 50px;
            right: 20px;
            text-align: center;
            color: #f5f5f5;
        }
        
        .main-title {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            line-height: 1.1;
        }
        
        .subtitle {
            font-size: 16px;
            font-style: italic;
            color: #d4af37;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .year {
            font-size: 14px;
            color: #999;
            font-weight: normal;
        }
        
        .camera-icon {
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            border: 3px solid #d4af37;
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.1);
        }
        
        .camera-icon::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 30%, transparent 50%);
        }
        
        .lens-flare {
            position: absolute;
            top: 180px;
            left: 60%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .documentary-label {
            position: absolute;
            bottom: 80px;
            left: 50px;
            right: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        
        .tribute-text {
            position: absolute;
            bottom: 40px;
            left: 50px;
            right: 20px;
            text-align: center;
            color: #d4af37;
            font-size: 11px;
            font-style: italic;
            line-height: 1.3;
        }
        
        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.05) 0%, transparent 50%);
            opacity: 0.7;
            pointer-events: none;
        }
        
        .spotlight {
            position: absolute;
            top: 120px;
            left: 30%;
            width: 150px;
            height: 200px;
            background: linear-gradient(45deg, 
                rgba(255, 255, 255, 0.02) 0%, 
                rgba(212, 175, 55, 0.05) 30%, 
                transparent 70%);
            transform: rotate(-15deg);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="film-strip"></div>
        <div class="spotlight"></div>
        <div class="lens-flare"></div>
        
        <div class="title-area">
            <div class="main-title">Arena</div>
            <div class="subtitle">John Cassavetes</div>
            <div class="year">1989</div>
        </div>
        
        <div class="camera-icon"></div>
        
        <div class="documentary-label">Documentary</div>
        <div class="tribute-text">A tribute to the<br>independent cinema pioneer</div>
        
        <div class="grain-overlay"></div>
    </div>
</body>
</html>
