[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "on_failure"

[env]
NEXT_TELEMETRY_DISABLED = "1"
NODE_ENV = "production"
FORCE_DEPLOY = "2025-07-10T12:25:00Z"

# Force nixpacks override - Railway should not use Docker
[settings]
docker_disabled = true