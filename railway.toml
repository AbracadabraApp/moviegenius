[build]
builder = "nixpacks"
buildCommand = "npm run build"
watchPatterns = ["nuclear-static/**/*.json", "pages/**", "lib/**", "scripts/**", "package.json", "next.config.js"]

[deploy]
startCommand = "npm start"
restartPolicyType = "on_failure"

[env]
NEXT_TELEMETRY_DISABLED = "1"
NODE_ENV = "production"
FORCE_DEPLOY = "2025-07-25T00:45:00Z"

# Force nixpacks override - Railway should not use Docker
[settings]
docker_disabled = true