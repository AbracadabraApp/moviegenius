This incident will be considered resolved when:
1. MediaCard lock is restored with technical enforcement
2. All movie navigation functions correctly across the application
3. No TMDB summaries appear in slug fields system-wide
4. Pre-commit hooks prevent future lock violations
5. Team processes updated to prevent recurrence

