## 🔄 Backup & Recovery

**Stable backup saved as:** `MediaCard.js.STABLE`

**To restore stable version:**
```bash
cp components/MediaCard.js.STABLE components/MediaCard.js
git add components/MediaCard.js
git commit -m "Restore stable MediaCard version"
```

