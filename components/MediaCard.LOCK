# 🔒 MediaCard Component Lock

**CRITICAL COMPONENT - DO NOT MODIFY WITHOUT APPROVAL**

## ⚠️ Why This Component is Locked

MediaCard is the **core component** used throughout the entire application:
- Movie recommendation pages
- Search results  
- List displays
- Ask page results
- Genius tab content
- iOS mobile app

**Changes to MediaCard break multiple parts of the site.**

## 🚫 Prohibited Changes

**DO NOT:**
- Modify component props or interface (**ESPECIALLY tmdbId prop**)
- Change styling or layout significantly  
- Remove or alter click/navigation behavior (**CRITICAL: handleCardClick function**)
- Modify poster loading or caching logic
- Change favorites/bookmark functionality
- Alter slug/text display logic
- Add new dependencies or imports

## 🚨 **CRITICAL: TMDB ID Navigation** 

**FREQUENTLY BROKEN:** The tmdbId prop and navigation logic are often modified, breaking movie page navigation.

**PROTECTED CODE SECTIONS:**
1. **Props interface** (Line ~50): `tmdbId` prop must remain unchanged
2. **Navigation function** (Lines 200-213): `handleCardClick` logic must preserve TMDB ID routing
3. **State management** (Lines 56, 65-68): `movieTmdbId` state updates must remain intact

**If TMDB ID navigation breaks:** Check that MediaCard receives `tmdbId={movie.tmdb_id}` and that the parsing functions in caller components include `tmdb_id: null` in movie objects.

## 🚨 **SPECIFIC BREAKAGE PATTERNS FIXED:**

### 1. **Marketing Slug Length Validation** (Line ~98)
**ISSUE:** Marketing slug length limit set incorrectly, either too low (35 chars) or too high (150+ chars).
**PROTECTION:** `slug.length <= 75` must remain unchanged - perfect for quality taglines.
**IMPACT:** Wrong limits either reject good taglines (too low) or allow verbose summaries (too high).

### 2. **TMDB Plot Summaries Replacing Marketing Slugs** (Line ~114-128)
**ISSUE:** TMDB API returns verbose plot summaries instead of concise marketing taglines.
**PROTECTION:** Must include `preferConcise: true` and reject `Plot:`, `Overview:`, `Synopsis:`.
**IMPACT:** Replaces curated marketing copy with long technical plot descriptions.

### 3. **Marketing Slug Display Spacing** (Line ~361)
**ISSUE:** `marginTop` increased from 2px to 4px or higher, affecting tagline display.
**PROTECTION:** `marginTop: '2px'` must remain unchanged for proper marketing copy spacing.
**IMPACT:** Creates excessive whitespace and poor visual hierarchy for user-facing content.

## ✅ Approved Changes Only

**ONLY MAKE CHANGES FOR:**
- Critical security fixes
- Performance optimizations (with testing)
- Bug fixes that don't change interface
- Changes approved by senior developer

## 🔧 Safe Change Process

1. **Create feature branch**: `git checkout -b mediacard-fix-description`
2. **Test thoroughly**: All pages that use MediaCard
3. **Document changes**: What changed and why
4. **Get approval**: Before merging to main
5. **Test in production**: Verify no regressions

