## COMPONENT VARIANTS:

### **Variant Specifications:**
1. **variant="icon"** - Circular chevron icon (default for detail pages)
2. **variant="text"** - Text-only back link (for admin/test pages)  
3. **variant="iconText"** - Icon + text combination (special cases)

### **Position Options:**
1. **position="top-left"** - Standard detail page position (default)
2. **position="top-right"** - Alternative positioning
3. **position="inline"** - Inline with other content

### **Size Options:**
1. **size="medium"** - Standard size (default)
2. **size="small"** - Compact areas
3. **size="large"** - Prominent placement

## NAVIGATION METHOD PROTECTION:

### **Smart Navigation (Required)**
- **Primary:** Use browser history when available
- **Fallback:** Context-aware route navigation
- **Emergency:** Default fallback route
- **SSR Safe:** Client-side detection only

### **Context-Aware Routes:**
- **Movie pages:** Fallback to `/ask` (search context)
- **Person pages:** Fallback to `/ask` (search context)
- **List pages:** Fallback to `/recs` (recommendations)
- **Episode pages:** Fallback to `/recs` (series context)

## VISUAL CONSISTENCY REQUIREMENTS:

### **Icon Standardization:**
- **Primary:** `CircleChevronLeft` from lucide-react
- **Alternative:** `ArrowLeft` for iconText variant
- **Prohibited:** `ChevronLeft`, custom icons, different libraries

### **Styling Standards:**
- **Color:** `#6b7280` (gray-500)
- **Hover:** `scale(1.05)` + light background
- **Size:** 24px default, 20px small, 28px large
- **Border radius:** 8px
- **Transition:** `all 0.2s ease`

## CHANGE PROTOCOL:

### **Before Modifying:**
1. **Check this lock file** for restrictions
2. **Review existing implementations** on detail pages
3. **Test browser integration** - forward/back buttons must work
4. **Verify context fallbacks** - ensure logical navigation

### **Adding to New Pages:**
1. **Import BackButton** component
2. **Use appropriate variant** and context
3. **Position consistently** (usually top-left)
4. **Test navigation flow** from multiple entry points

### **Prohibited Changes:**
- ❌ Creating alternative back button components
- ❌ Using different navigation methods
- ❌ Changing icon libraries or visual styles
- ❌ Removing browser history integration
- ❌ Modifying context-aware fallback logic

