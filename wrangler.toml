# Wrangler configuration for MovieGenius Cloudflare Worker
name = "moviegenius-worker"
main = "_worker.js"
compatibility_date = "2024-06-10"
compatibility_flags = ["nodejs_compat"]

# Worker settings optimized for performance
[env.production]
name = "moviegenius-production"
# route = { pattern = "moviegenius.ai/*", zone_name = "moviegenius.ai" } # DISABLED - bypass worker

[env.staging] 
name = "moviegenius-staging"
route = { pattern = "staging.moviegenius.ai/*", zone_name = "moviegenius.ai" }

# Cache settings
[cache]
enable = true

# Performance optimizations
[build]
command = ""
cwd = "."
watch_dir = "."

# Environment variables (set via dashboard or CLI)
[vars]
ENVIRONMENT = "production"

# Analytics and monitoring
[analytics_engine_datasets]
[[analytics_engine_datasets.bindings]]
name = "PERFORMANCE_ANALYTICS"
dataset = "moviegenius-performance"