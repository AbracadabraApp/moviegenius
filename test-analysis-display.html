<!DOCTYPE html>
<html>
<head>
    <title>Railway PostgreSQL Analysis Display Test</title>
</head>
<body>
    <h1>Movie Analysis Display Test</h1>
    <div id="result">Loading...</div>

    <script>
        // Test Railway analysis display
        fetch('/api/movie-analysis-railway?tmdbId=963')
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                
                if (data.success && data.analysis) {
                    resultDiv.innerHTML = `
                        <h2>✅ SUCCESS: ${data.movie.title} (${data.movie.year})</h2>
                        <p><strong>Source:</strong> ${data.source}</p>
                        <p><strong>Analysis Type:</strong> ${data.analysis.type}</p>
                        <p><strong>Has Content:</strong> ${!!data.analysis.content}</p>
                        <p><strong>Created:</strong> ${new Date(data.analysis.created_at).toLocaleDateString()}</p>
                        <hr>
                        <h3>Complete API Response:</h3>
                        <pre style="background: #f5f5f5; padding: 10px; max-height: 400px; overflow-y: scroll;">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<h2>❌ FAILED</h2><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            })
            .catch(error => {
                document.getElementById('result').innerHTML = `<h2>❌ ERROR</h2><p>${error.message}</p>`;
            });
    </script>
</body>
</html>
